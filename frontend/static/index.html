<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZD Code</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css" id="hljs-dark">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css" id="hljs-light" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* Theme variables */
:root,[data-theme="dark"]{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#1e1e2e;--bg4:#141420;
  --border:#1e1e2e;--border2:#2a2a3e;
  --text:#e0e0e0;--text2:#aaa;--text3:#888;--text4:#666;--text5:#555;
  --link:#60a5fa;--accent:#2563eb;--accent2:#3b82f6;--accent3:#1e40af;
  --danger:#dc2626;--danger2:#ef4444;--warn:#f59e0b;--success:#22c55e;
  --code-bg:#111118;
}
[data-theme="light"]{
  --bg:#f5f5f5;--bg2:#ffffff;--bg3:#e8e8e8;--bg4:#f0f0f0;
  --border:#d4d4d4;--border2:#c0c0c0;
  --text:#1a1a1a;--text2:#555;--text3:#666;--text4:#888;--text5:#999;
  --link:#2563eb;--accent:#2563eb;--accent2:#3b82f6;--accent3:#1e40af;
  --danger:#dc2626;--danger2:#ef4444;--warn:#d97706;--success:#16a34a;
  --code-bg:#f0f0f0;
}
[data-theme="warm"]{
  --bg:#f5f0e8;--bg2:#faf5ed;--bg3:#ede5d8;--bg4:#f0ead8;
  --border:#d4c8b0;--border2:#c4b8a0;
  --text:#3d3224;--text2:#6b5d4a;--text3:#8a7a66;--text4:#a0906e;--text5:#b5a580;
  --link:#b45309;--accent:#b45309;--accent2:#d97706;--accent3:#92400e;
  --danger:#c2410c;--danger2:#ea580c;--warn:#ca8a04;--success:#65a30d;
  --code-bg:#ede5d8;
}

body{height:100vh;display:flex;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;font-size:14px}

.sidebar{width:260px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:12px;border-bottom:1px solid var(--border)}
.sidebar-tabs{display:flex;gap:0;margin-bottom:8px;background:var(--bg3);border-radius:8px;padding:3px;position:relative}
.sidebar-tab{flex:1;padding:8px 0;border:none;background:transparent;color:var(--text3);font-size:12px;cursor:pointer;transition:all .2s;border-radius:6px;font-weight:500}
.sidebar-tab:hover{color:var(--text)}
.sidebar-tab.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.project-list{flex:1;overflow-y:auto;padding:4px 0;display:none}
.proj-group{margin-bottom:2px}
.proj-name{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2);font-weight:500;transition:background .15s}
.proj-name:hover{background:var(--bg3)}
.proj-name .arrow{font-size:10px;transition:transform .2s;color:var(--text4)}
.proj-name.open .arrow{transform:rotate(90deg)}
.proj-files{display:none;padding:0 0 4px 0}
.proj-files.open{display:block}
.proj-file{padding:6px 12px 6px 28px;cursor:pointer;font-size:12px;color:var(--text3);transition:background .15s;display:flex;align-items:center;gap:6px}
.proj-file:hover{background:var(--bg3);color:var(--text)}
.proj-file.active{background:var(--bg3);color:var(--text);border-left:2px solid var(--accent)}
.proj-file .file-icon{color:var(--text5);font-size:11px}
.doc-view{flex:1;display:none;flex-direction:column;min-width:0}
.doc-view.active{display:flex}
.doc-header{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg2);gap:12px}
.doc-back{padding:4px 12px;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text2);font-size:12px;cursor:pointer}
.doc-back:hover{background:var(--bg3)}
.doc-title{font-size:13px;color:var(--text3)}
.doc-content{flex:1;overflow-y:auto;padding:24px 16px}
.doc-content-inner{max-width:800px;margin:0 auto}
.doc-content-inner .bubble{padding:10px 14px;border-radius:16px;background:var(--bg3);color:var(--text);line-height:1.6}
.doc-content-inner .bubble a{color:var(--link)}
.doc-content-inner .bubble pre{background:var(--code-bg);padding:8px;border-radius:6px;overflow-x:auto;margin:8px 0;font-size:13px}
.doc-content-inner .bubble code{font-family:'Fira Code',monospace;font-size:13px}
.doc-content-inner .bubble p{margin:4px 0}
.doc-content-inner .bubble ul,.doc-content-inner .bubble ol{margin:4px 0;padding-left:20px}
.doc-content-inner .bubble blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--text4);margin:4px 0}
.doc-content-inner .bubble table{border-collapse:collapse;margin:8px 0;width:100%}
.doc-content-inner .bubble th,.doc-content-inner .bubble td{border:1px solid var(--border2);padding:6px 10px;font-size:13px}
.doc-content-inner .bubble th{background:var(--bg4);font-weight:500}
.doc-actions{display:flex;gap:6px;margin-left:auto}
.doc-btn{padding:4px 10px;border:1px solid var(--border2);border-radius:5px;background:transparent;color:var(--text3);font-size:11px;cursor:pointer;transition:all .15s}
.doc-btn:hover{background:var(--bg3);color:var(--text)}
.doc-btn.danger{border-color:var(--danger);color:var(--danger)}
.doc-btn.danger:hover{background:var(--danger);color:#fff}
.doc-edit-area{flex:1;display:flex;flex-direction:column;padding:16px}
.doc-edit-area textarea{flex:1;resize:none;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:12px;color:var(--text);font-family:'Fira Code',monospace;font-size:13px;line-height:1.6;outline:none}
.doc-edit-area textarea:focus{border-color:var(--accent)}
.doc-edit-actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.doc-edit-actions button{padding:6px 16px;border-radius:6px;font-size:12px;cursor:pointer;border:none}
.doc-edit-actions .save-btn{background:var(--accent);color:#fff}
.doc-edit-actions .save-btn:hover{background:var(--accent2)}
.doc-edit-actions .cancel-btn{background:transparent;border:1px solid var(--border2);color:var(--text3)}
.doc-edit-actions .cancel-btn:hover{background:var(--bg3)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.show{display:flex}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;min-width:320px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
.modal-title{font-size:14px;color:var(--text);margin-bottom:12px;font-weight:500}
.modal-input{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;outline:none;box-sizing:border-box}
.modal-input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.modal-actions button{padding:6px 16px;border-radius:6px;font-size:12px;cursor:pointer;border:none}
.modal-actions .confirm-btn{background:var(--accent);color:#fff}
.modal-actions .confirm-btn:hover{background:var(--accent2)}
.modal-actions .cancel-btn{background:transparent;border:1px solid var(--border2);color:var(--text3)}
.modal-actions .cancel-btn:hover{background:var(--bg3)}
.chat-title-edit{background:var(--bg3);border:1px solid var(--accent);border-radius:4px;padding:2px 6px;color:var(--text);font-size:13px;outline:none;font-family:inherit;width:100%;box-sizing:border-box}
.sidebar-header button{width:100%;padding:8px 12px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer}
.sidebar-header button:hover{background:var(--accent2)}
.chat-list{flex:1;overflow-y:auto;padding:4px 0}
.chat-item{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);border-left:2px solid transparent;transition:background .15s}
.chat-item:hover{background:var(--bg3)}
.chat-item.active{background:var(--bg3);color:var(--text);border-left-color:var(--accent)}
.chat-item .chat-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .chat-delete{color:var(--text4);font-size:14px;cursor:pointer;padding:2px 6px;border-radius:4px;opacity:1}
.chat-item:hover .chat-delete{opacity:1}
.chat-item .chat-delete:hover{color:var(--danger2)}
.sidebar-info{padding:12px;border-top:1px solid var(--border);font-size:12px;color:var(--text4)}
.sidebar-info .label{color:var(--text5);margin-bottom:4px}
.sidebar-info .value{color:var(--text3);margin-bottom:12px;word-break:break-all}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.status-dot.on{background:var(--success)}
.status-dot.off{background:var(--danger2)}
.sidebar-footer{padding:8px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--text5);display:flex;align-items:center;justify-content:space-between}

.theme-switch{display:flex;gap:4px}
.theme-btn{padding:2px 8px;border:1px solid var(--border2);border-radius:4px;background:transparent;color:var(--text4);font-size:10px;cursor:pointer}
.theme-btn:hover{background:var(--bg3)}
.theme-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg2)}
.header span{font-size:13px;color:var(--text3)}

.messages{flex:1;overflow-y:auto;padding:24px 16px}
.messages-inner{max-width:800px;margin:0 auto}
.msg{margin-bottom:16px}
.msg-user{display:flex;justify-content:flex-end}
.msg-user .bubble{max-width:80%;padding:10px 14px;border-radius:16px;background:var(--accent);color:#fff;white-space:pre-wrap;line-height:1.6}
.msg-assistant{display:flex;justify-content:flex-start}
.msg-assistant .bubble{max-width:80%;padding:10px 14px;border-radius:16px;background:var(--bg3);color:var(--text);line-height:1.6}
.msg-assistant .bubble a{color:var(--link)}
.msg-assistant .bubble pre{background:var(--code-bg);padding:8px;border-radius:6px;overflow-x:auto;margin:8px 0;font-size:13px}
.msg-assistant .bubble code{font-family:'Fira Code',monospace;font-size:13px}
.msg-assistant .bubble p{margin:4px 0}
.msg-assistant .bubble ul,.msg-assistant .bubble ol{margin:4px 0;padding-left:20px}
.msg-assistant .bubble blockquote{border-left:3px solid var(--border);padding-left:10px;color:var(--text4);margin:4px 0}

.thinking-summary{font-size:11px;color:var(--text3);cursor:pointer;margin-bottom:4px}
.thinking-content{font-size:12px;color:var(--text3);max-height:150px;overflow-y:auto;padding:6px;background:var(--bg4);border-radius:6px;margin-bottom:8px}

.msg-tool{display:flex;justify-content:flex-start}
.msg-tool .bubble{max-width:80%;padding:6px 10px;border-radius:8px;background:var(--bg4);border:1px solid var(--border);font-size:12px;color:var(--text4)}
.msg-tool .tool-name{color:var(--link);font-weight:500}
.msg-tool pre{margin-top:4px;font-size:11px;color:var(--text5);max-height:80px;overflow-y:auto;white-space:pre-wrap}

.msg-system{text-align:center;font-size:12px;color:var(--danger2);padding:4px}
.msg-stopped{text-align:center;font-size:12px;color:var(--warn);padding:4px}

.input-area{border-top:1px solid var(--border);background:var(--bg2);padding:16px}
.input-inner{max-width:800px;margin:0 auto}
.input-box{display:flex;flex-direction:column;border-radius:12px;background:var(--bg3);border:1px solid var(--border2);overflow:hidden}
.input-box textarea{flex:1;resize:vertical;min-height:100px;max-height:300px;border:none;background:transparent;padding:10px 14px;color:var(--text);font-size:13px;outline:none;font-family:inherit;width:100%;box-sizing:border-box}
.input-box:focus-within{border-color:var(--accent)}
.input-box textarea::placeholder{color:var(--text5)}
.input-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;}
.input-toolbar .toolbar-spacer{flex:1}
.input-box .send-btn,.input-box .stop-btn{width:36px;height:36px;border:none;border-radius:10px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.input-box .send-btn{background:var(--accent)}
.input-box .send-btn:hover{background:var(--accent2)}
.input-box .send-btn:disabled{background:var(--accent3);color:var(--text5);cursor:not-allowed}
.input-box .stop-btn{background:transparent;border:2px solid var(--danger);color:var(--danger);display:none}
.input-box .stop-btn:hover{background:var(--danger);color:#fff}
.input-box .upload-btn{width:32px;height:32px;border:none;border-radius:8px;background:transparent;color:var(--text3);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.input-box .upload-btn:hover{background:var(--bg3-hover);color:var(--accent)}
.file-preview{margin:0;padding:8px 10px;display:flex;flex-wrap:wrap;gap:8px;}
.file-preview-item{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text2);max-width:200px}
.file-preview-item img{width:32px;height:32px;object-fit:cover;border-radius:4px}
.file-preview-item .file-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--bg4);border-radius:4px;font-size:16px}
.file-preview-item .file-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-preview-item .file-remove{width:20px;height:20px;border:none;border-radius:50%;background:var(--bg4);color:var(--text4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.2s}
.file-preview-item .file-remove:hover{background:var(--danger);color:#fff}

/* Bounce dots animation */
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.typing{color:var(--text4);font-style:italic}
.typing .dot{display:inline-block;animation:bounce 1.4s infinite}
.typing .dot:nth-child(2){animation-delay:0.15s}
.typing .dot:nth-child(3){animation-delay:0.3s}


/* Permission mode selector */
.mode-select{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text2);font-size:12px;padding:6px 8px;cursor:pointer;outline:none;height:32px}
.mode-select:focus{border-color:var(--accent)}
.mode-select option{background:var(--bg2);color:var(--text)}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" id="tabChat" onclick="switchSidebarTab('chat')">对话</button>
      <button class="sidebar-tab" id="tabProjects" onclick="switchSidebarTab('projects')">项目文档</button>
    </div>
    <button id="newChatBtn" onclick="newChat()">+ 新对话</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="project-list" id="projectList"></div>
  <div class="sidebar-info">
    <div class="label">状态</div>
    <div class="value"><span class="status-dot off" id="statusDot"></span><span id="statusText">未连接</span></div>
    <div class="label">工作目录</div>
    <div class="value" id="workspaceDir" style="cursor:pointer" title="点击修改" onclick="editWorkspace()">-</div>
    <div class="label">Session</div>
    <div class="value" id="sessionId">-</div>
  </div>
  <div class="sidebar-footer">
    <span>界面主题</span>
    <div class="theme-switch">
      <button class="theme-btn" data-t="dark" onclick="setTheme('dark')">&#9789;</button>
      <button class="theme-btn" data-t="light" onclick="setTheme('light')">&#9788;</button>
      <button class="theme-btn" data-t="warm" onclick="setTheme('warm')">&#9731;</button>
    </div>
  </div>
</div>
<div class="main" id="chatMain">
  <div class="header"><span>ZD Code</span></div>
  <div class="messages" id="messages"><div class="messages-inner" id="messagesInner"></div></div>
  <div class="input-area">
    <div class="input-inner">
      <div class="input-box">
<textarea id="input" rows="1" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)"></textarea>
        <div class="input-toolbar">
          <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()" title="上传文件">&#128206;</button>
          <input type="file" id="fileInput" multiple style="display:none" onchange="handleFileSelect(event)">
          <div class="toolbar-spacer"></div>
          <select class="mode-select" id="modeSelect" title="切换权限模式">
            <option value="bypassPermissions">无限制</option>
          </select>
          <button class="stop-btn" id="stopBtn" onclick="stopGeneration()">G</button>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>&#8593;</button>
        </div>
        <div class="file-preview" id="filePreview" style="display:none"></div>
      </div>
    </div>
  </div>
</div>
<div class="doc-view" id="docView">
  <div class="doc-header">
    <button class="doc-back" onclick="closeDocView()">&#8592; 返回</button>
    <span class="doc-title" id="docTitle"></span>
    <div class="doc-actions">
      <button class="doc-btn" onclick="editDoc()">编辑</button>
      <button class="doc-btn" onclick="showNewDocModal()">新建</button>
      <button class="doc-btn danger" onclick="deleteDoc()">删除</button>
    </div>
  </div>
  <div class="doc-content" id="docContentArea"><div class="doc-content-inner" id="docContentInner"></div></div>
  <div class="doc-edit-area" id="docEditArea" style="display:none">
    <textarea id="docEditText"></textarea>
    <div class="doc-edit-actions">
      <button class="cancel-btn" onclick="cancelEdit()">取消</button>
      <button class="save-btn" onclick="saveDoc()">保存</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">新建文档</div>
    <input type="text" class="modal-input" id="modalInput" placeholder="输入文件名（如 05-新文档.md）">
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">取消</button>
      <button class="confirm-btn" id="modalConfirmBtn" onclick="modalConfirm()">确认</button>
    </div>
  </div>
</div>

<script>
const API = 'http://' + window.location.hostname + ':8000';
const WS = 'ws://' + window.location.hostname + ':8000';

let currentSessionId = '';
let wsMap = new Map();
let sessionConnected = new Map();
let sessionStreamingText = new Map();
let sessionStreamingThinking = new Map();
let sessionAssistantEl = new Map();
let sessionIsGenerating = new Map();
let sessionMsgs = new Map();
let messageHistory = [];
let historyIndex = -1;
let tempInput = '';
// 按会话隔离输入状态
const sessionInputState = new Map(); // sessionId -> { history: [], index: -1, tempInput: '', value: '' }

// --- Theme ---
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  // Switch hljs stylesheet
  const isDark = theme === 'dark';
  document.getElementById('hljs-dark').disabled = !isDark;
  document.getElementById('hljs-light').disabled = isDark;
  // Update active button
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.t === theme);
  });
}

function setTheme(theme) {
  localStorage.setItem('theme', theme);
  applyTheme(theme);
}

// Init theme
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  applyTheme(saved);

})();

marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    return hljs.highlightAuto(code).value;
  },
  breaks: true
});

// --- Chat List ---

async function loadChatList() {
  const res = await fetch(API + '/api/sessions');
  const list = await res.json();
  renderChatList(list);
  return list;
}

function renderChatList(list) {
  const el = document.getElementById('chatList');
  el.innerHTML = '';
  for (const item of list) {
    const div = document.createElement('div');
    div.className = 'chat-item' + (item.id === currentSessionId ? ' active' : '');
    const titleSpan = document.createElement('span');
    titleSpan.className = 'chat-title';
    titleSpan.textContent = item.title || '新对话';
    titleSpan.ondblclick = function(e) { e.stopPropagation(); enableRename(this, item.id); };
    const delSpan = document.createElement('span');
    delSpan.className = 'chat-delete';
    delSpan.innerHTML = '\u00d7';
    delSpan.onclick = function(e) { e.stopPropagation(); deleteChat(item.id); };
    div.innerHTML = '';
    div.appendChild(titleSpan);
    div.appendChild(delSpan);
    div.onclick = () => switchChat(item.id);
    el.appendChild(div);
  }
}

async function deleteChat(sessionId) {
  await fetch(API + '/api/sessions/' + sessionId, { method: 'DELETE' });
  if (wsMap.has(sessionId)) { wsMap.get(sessionId).close(); wsMap.delete(sessionId); }
  sessionConnected.delete(sessionId);
  sessionMsgs.delete(sessionId);
  if (sessionId === currentSessionId) {
    currentSessionId = '';
    document.getElementById('messagesInner').innerHTML = '';
    updateConnectedUI();
  }
  await loadChatList();
  if (!currentSessionId) { newChat(); }
}

// --- Session Management ---

async function newChat() {
  if (currentSessionId && wsMap.has(currentSessionId)) {
    wsMap.get(currentSessionId).close();
    wsMap.delete(currentSessionId);
  }
  sessionConnected.set(currentSessionId, false);
  updateConnectedUI();
  document.getElementById('messagesInner').innerHTML = '';
  try {
    const res = await fetch(API + '/api/sessions', { method: 'POST' });
    const data = await res.json();
    currentSessionId = data.session_id;
    document.getElementById('sessionId').textContent = currentSessionId.slice(0, 8) + '...';
    connectWS();
    await loadChatList();
  } catch (err) {
    addSystemMsg('创建对话失败: ' + err.message);
  }
}

async function switchChat(sessionId) {
  if (sessionId === currentSessionId) return;
  // Save current session streaming state and input state
  if (currentSessionId) {
    sessionStreamingText.set(currentSessionId, streamingText);
    sessionStreamingThinking.set(currentSessionId, streamingThinking);
    sessionIsGenerating.set(currentSessionId, isGenerating);
    sessionAssistantEl.set(currentSessionId, null);
    // 保存输入状态
    sessionInputState.set(currentSessionId, {
      history: [...messageHistory],
      index: historyIndex,
      tempInput: tempInput,
      value: document.getElementById('input').value
    });
  }
  // DO NOT close old WebSocket - keep it alive
  currentSessionId = sessionId;
  document.getElementById('sessionId').textContent = sessionId.slice(0, 8) + '...';
  document.getElementById('messagesInner').innerHTML = '';
  try {
    const res = await fetch(API + '/api/sessions/' + sessionId + '/history');
    const history = await res.json();
    for (const msg of history) {
      if (msg.role === 'user') addUserMsg(msg.content);
      else if (msg.role === 'assistant') addAssistantMsg(msg.content);
    }
    scrollBottom();
  } catch (err) {
    addSystemMsg('加载历史失败: ' + err.message);
  }
  // Restore streaming state for this session
  streamingText = sessionStreamingText.get(sessionId) || '';
  streamingThinking = sessionStreamingThinking.get(sessionId) || '';
  isGenerating = sessionIsGenerating.get(sessionId) || false;
  currentAssistantEl = null;
  if (isGenerating && (streamingText || streamingThinking)) {
    ensureAssistantBubble();
    updateStreamingBubble();
    showStopBtn(true);
  } else {
    showStopBtn(false);
  }
  // 恢复输入状态
  const savedInput = sessionInputState.get(sessionId);
  if (savedInput) {
    messageHistory = savedInput.history;
    historyIndex = savedInput.index;
    tempInput = savedInput.tempInput;
    document.getElementById('input').value = savedInput.value;
  } else {
    messageHistory = [];
    historyIndex = -1;
    tempInput = '';
    document.getElementById('input').value = '';
  }
  if (!wsMap.has(sessionId)) { connectWS(); }
  updateConnectedUI();
  await loadChatList();
}


// --- WebSocket ---

function connectWS() {
  if (wsMap.has(currentSessionId)) { wsMap.get(currentSessionId).close(); }
  const socket = new WebSocket(WS + '/ws/' + currentSessionId);
  wsMap.set(currentSessionId, socket);
  const sid = currentSessionId;
  if (!sessionMsgs.has(sid)) sessionMsgs.set(sid, []);
  socket.onopen = () => {
    sessionConnected.set(sid, true);
    if (sid === currentSessionId) updateConnectedUI();
  };
  socket.onclose = () => {
    sessionConnected.set(sid, false);
    if (sid === currentSessionId) updateConnectedUI();
  };
  socket.onerror = () => {
    sessionConnected.set(sid, false);
    if (sid === currentSessionId) updateConnectedUI();
  };
  socket.onmessage = e => {
    try { handleMsg(JSON.parse(e.data), sid); } catch {}
  };
}

function updateConnectedUI() {
  const v = sessionConnected.get(currentSessionId) || false;
  document.getElementById('statusDot').className = 'status-dot ' + (v ? 'on' : 'off');
  document.getElementById('statusText').textContent = v ? '已连接' : '未连接';
  document.getElementById('sendBtn').disabled = !v;
}

// --- Streaming ---

function resetStreaming() {

}

function showStopBtn(show) {

  document.getElementById('stopBtn').style.display = show ? 'inline-block' : 'none';

async function stopGeneration() {

  } catch (err) {

  }
}

// --- Message Handling ---

function handleMsg(msg, sid) {
  sid = sid || currentSessionId;
  if (msg.type === 'system' && msg.subtype === 'init') return;
  if (msg.type === 'assistant') {
    const content = msg.message?.content;
    if (!content) return;
    // stream-json 的 assistant 消息是全量的 content 数组，需要重新计算而不是累加
    let st = '';
    let sth = '';
    for (const block of content) {
      if (block.type === 'thinking') { sth += (block.thinking || block.text || ''); }
      else if (block.type === 'text') { st += block.text; }
      else if (block.type === 'tool_use') {
        if (sid === currentSessionId) { streamingText = st; streamingThinking = sth; finalizeStreaming(); }
        if (sid === currentSessionId) addToolMsg(block.name, block.input ? JSON.stringify(block.input, null, 2) : '');
      }
      else if (block.type === 'tool_result') {
        if (sid === currentSessionId) addToolMsg('result', block.content || '');
      }
    }
    sessionStreamingText.set(sid, st);
    sessionStreamingThinking.set(sid, sth);
    if (sid === currentSessionId) { streamingText = st; streamingThinking = sth; updateStreamingBubble(); }
    return;
  }
  if (msg.type === 'result') {
    if (sid === currentSessionId) { finalizeStreaming(); showStopBtn(false); }
    sessionIsGenerating.set(sid, false);
    sessionStreamingText.set(sid, '');
    sessionStreamingThinking.set(sid, '');
    sessionAssistantEl.set(sid, null);
    loadChatList();
    return;
  }
  if (msg.type === 'stopped') {
    if (sid === currentSessionId) { finalizeStreaming(); addStoppedMsg(); }
    sessionIsGenerating.set(sid, false);
    sessionStreamingText.set(sid, '');
    sessionStreamingThinking.set(sid, '');
    sessionAssistantEl.set(sid, null);
    return;
  }
  if (msg.type === 'error') { if (sid === currentSessionId) addSystemMsg(msg.content || 'Unknown error'); return; }
}

function ensureAssistantBubble() {
  if (!currentAssistantEl) {
    currentAssistantEl = document.createElement('div');
    currentAssistantEl.className = 'msg msg-assistant';
    currentAssistantEl.innerHTML = '<div class="bubble"></div>';
    document.getElementById('messagesInner').appendChild(currentAssistantEl);
    scrollBottom();
  }
}

function updateStreamingBubble() {
  ensureAssistantBubble();
  let html = '';
  if (streamingThinking) html += '<details open><summary class="thinking-summary">思考中...</summary><div class="thinking-content">' + marked.parse(streamingThinking) + '</div></details>';
  if (streamingText) html += marked.parse(streamingText);
  if (!streamingText && !streamingThinking) html = '<span class="typing">思考中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>';
  currentAssistantEl.querySelector('.bubble').innerHTML = html;
  scrollBottom();
}

function finalizeStreaming() {
  if (!currentAssistantEl || (!streamingText && !streamingThinking)) { currentAssistantEl = null; streamingText = ''; streamingThinking = ''; return; }
  let html = '';
  if (streamingThinking) html += '<details><summary class="thinking-summary">思考过程</summary><div class="thinking-content">' + marked.parse(streamingThinking) + '</div></details>';
  html += marked.parse(streamingText);
  currentAssistantEl.querySelector('.bubble').innerHTML = html;
  currentAssistantEl = null; streamingText = ''; streamingThinking = '';
  if (currentSessionId) sessionAssistantEl.set(currentSessionId, null);
}

function addUserMsg(text) { const el = document.createElement('div'); el.className = 'msg msg-user'; el.innerHTML = '<div class="bubble">' + escapeHtml(text) + '</div>'; document.getElementById('messagesInner').appendChild(el); scrollBottom(true); }
function addAssistantMsg(text) { const el = document.createElement('div'); el.className = 'msg msg-assistant'; el.innerHTML = '<div class="bubble">' + marked.parse(text) + '</div>'; document.getElementById('messagesInner').appendChild(el); }
function addToolMsg(name, content) { const el = document.createElement('div'); el.className = 'msg msg-tool'; let inner = '<div class="bubble"><span class="tool-name">[' + escapeHtml(name) + ']</span>'; if (content) { const d = content.length > 500 ? content.slice(0, 500) + '...' : content; inner += '<pre>' + escapeHtml(d) + '</pre>'; } inner += '</div>'; el.innerHTML = inner; document.getElementById('messagesInner').appendChild(el); scrollBottom(); }
function addSystemMsg(text) { const el = document.createElement('div'); el.className = 'msg-system'; el.textContent = text; document.getElementById('messagesInner').appendChild(el); scrollBottom(); }
function addStoppedMsg() { const el = document.createElement('div'); el.className = 'msg-stopped'; el.textContent = '已中断'; document.getElementById('messagesInner').appendChild(el); scrollBottom(); }

async function editWorkspace() {
  const el = document.getElementById('workspaceDir');

  el.appendChild(input); input.focus(); input.select();
  async function save() {
    const val = input.value.trim();

      try { const res = await fetch(API + '/api/workspace', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({workspace: val}) }); const data = await res.json(); el.textContent = data.workspace; updateConnectedUI(); return; } catch (err) { addSystemMsg('更新工作目录失败: ' + err.message); }
    }

// --- File Upload ---
let selectedFiles = [];

function handleFileSelect(event) {
  const files = Array.from(event.target.files);
  if (!files.length) return;
  
  // Check file size (max 20MB)
  const maxSize = 20 * 1024 * 1024;
  for (const file of files) {
    if (file.size > maxSize) {
      alert(`文件 ${file.name} 超过 20MB 限制`);
      return;
    }
  }
  
  selectedFiles = selectedFiles.concat(files);
  renderFilePreview();
  event.target.value = ''; // Reset input
}

function renderFilePreview() {
  const preview = document.getElementById('filePreview');
  if (!selectedFiles.length) {
    preview.style.display = 'none';
    preview.innerHTML = '';
    return;
  }
  
  preview.style.display = 'flex';
  preview.innerHTML = '';
  
  selectedFiles.forEach((file, index) => {
    const item = document.createElement('div');
    item.className = 'file-preview-item';
    
    const isImage = file.type.startsWith('image/');
    let previewContent = '';
    
    if (isImage) {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.onload = () => URL.revokeObjectURL(img.src);
      item.appendChild(img);
    } else {
      const icon = document.createElement('div');
      icon.className = 'file-icon';
      icon.textContent = getFileIcon(file.name);
      item.appendChild(icon);
    }
    
    const name = document.createElement('div');
    name.className = 'file-name';
    name.textContent = file.name;
    name.title = file.name;
    item.appendChild(name);
    
    const remove = document.createElement('button');
    remove.className = 'file-remove';
    remove.innerHTML = '×';
    remove.onclick = () => removeFile(index);
    item.appendChild(remove);
    
    preview.appendChild(item);
  });
}

function getFileIcon(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  const icons = {
    'pdf': '📄', 'doc': '📝', 'docx': '📝',
    'xls': '📊', 'xlsx': '📊', 'csv': '📊',
    'ppt': '📑', 'pptx': '📑',
    'txt': '📃', 'md': '📃', 'json': '📃',
    'js': '💻', 'ts': '💻', 'py': '💻', 'java': '💻',
    'html': '🌐', 'css': '🎨'
  };
  return icons[ext] || '📎';
}

function removeFile(index) {
  selectedFiles.splice(index, 1);
  renderFilePreview();
}

// Drag and drop support
const inputArea = document.querySelector('.input-area');
inputArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.stopPropagation();
});

inputArea.addEventListener('drop', (e) => {
  e.preventDefault();
  e.stopPropagation();
  
  const files = Array.from(e.dataTransfer.files);
  if (!files.length) return;
  
  const maxSize = 20 * 1024 * 1024;
  for (const file of files) {
    if (file.size > maxSize) {
      alert(`文件 ${file.name} 超过 20MB 限制`);
      return;
    }
  }
  
  selectedFiles = selectedFiles.concat(files);
  renderFilePreview();
});


async function uploadFiles(files) {
  if (!files.length) return [];
  
  const formData = new FormData();
  for (const file of files) {
    formData.append('files', file);
  }
  
  try {
    const res = await fetch(API + '/api/upload', {
      method: 'POST',
      body: formData
    });
    
    if (!res.ok) throw new Error('Upload failed');
    
    const data = await res.json();
    return data.files.map(f => f.path);
  } catch (err) {
    console.error('Upload error:', err);
    alert('文件上传失败: ' + err.message);
    return [];
  }
}

async function sendMessage() {
  const input = document.getElementById('input'); const text = input.value.trim();
  const _conn = sessionConnected.get(currentSessionId); if (!text || !_conn) return;
  
  // Upload files first if any
  let filePaths = [];
  if (selectedFiles.length) {
    filePaths = await uploadFiles(selectedFiles);
    if (!filePaths.length && selectedFiles.length) {
      // Upload failed, don't send message
      return;
    }
    selectedFiles = [];
    renderFilePreview();
  }
  
  messageHistory.push(text); historyIndex = -1; tempInput = '';
  input.value = '';
  addUserMsg(text); streamingText = ''; streamingThinking = ''; currentAssistantEl = null; isGenerating = true; showStopBtn(true);
  ensureAssistantBubble(); currentAssistantEl.querySelector('.bubble').innerHTML = '<span class="typing">思考中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>';
  const wsConn = wsMap.get(currentSessionId);
  if (wsConn && wsConn.readyState === WebSocket.OPEN) {
    wsConn.send(JSON.stringify({ type: 'message', content: text, files: filePaths }));
  }
}

function scrollBottom(force) {
  const el = document.getElementById('messages');
  if (force === true) { el.scrollTop = el.scrollHeight; return; }
  // Only auto-scroll if user is near bottom (within 80px)
  const isNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  if (isNearBottom) el.scrollTop = el.scrollHeight;
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('input').addEventListener('keydown', function(e) {
  const input = e.target;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (messageHistory.length === 0) return;
    if (historyIndex === -1) tempInput = input.value;
    if (historyIndex < messageHistory.length - 1) {
      historyIndex++;
      input.value = messageHistory[messageHistory.length - 1 - historyIndex];
    }
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex === -1) return;
    historyIndex--;
    if (historyIndex === -1) input.value = tempInput;
    else input.value = messageHistory[messageHistory.length - 1 - historyIndex];
  }
});
document.getElementById('input').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

  };
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(() => document.getElementById('modalInput').focus(), 100);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  modalCallback = null;
}

function modalConfirm() {
  const val = document.getElementById('modalInput').value.trim();
  if (!val) return;
  if (modalCallback) modalCallback(val);
  closeModal();
}

document.getElementById('modalInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); modalConfirm(); }
  if (e.key === 'Escape') { closeModal(); }
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// --- Chat Rename ---
function enableRename(element, sessionId) {
  if (element.querySelector('input')) return;
  const current = element.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'chat-title-edit';
  input.value = current;
  element.textContent = '';
  element.appendChild(input);
  input.focus();
  input.select();
  
  function save() {
    const val = input.value.trim();
    if (val && val !== current) {
      fetch(API + '/api/sessions/' + sessionId + '/title', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title: val})
      })
      .then(r => { if(!r.ok) throw new Error('Rename failed'); return r.json(); })
      .then(() => { loadChatList(); })
      .catch(err => { alert('重命名失败: ' + err.message); element.textContent = current; });
    } else {
      element.textContent = current;
    }
  }
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { element.textContent = current; }
  });
  input.addEventListener('blur', save);
}

// --- Init ---

(async function init() {
  await loadModes();
  const list = await loadChatList();
  try { const h = await fetch(API + '/api/health'); const hd = await h.json(); document.getElementById('workspaceDir').textContent = hd.workspace || '-'; } catch {}
  if (list.length > 0) await switchChat(list[0].id); else await newChat();
})();
</script>
