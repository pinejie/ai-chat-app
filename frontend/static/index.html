<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZD Code</title>
<link rel="stylesheet" href="/static/highlight-theme-dark.css" id="hljs-dark">
<link rel="stylesheet" href="/static/highlight-theme-light.css" id="hljs-light" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/js/highlight.min.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" id="tabChat" onclick="switchSidebarTab('chat')">对话</button>
      <button class="sidebar-tab" id="tabProjects" onclick="switchSidebarTab('projects')">项目文档</button>
    </div>
    <button id="newChatBtn" onclick="newChat()">+ 新对话</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="project-list" id="projectList"></div>
  <div class="sidebar-info">
    <div class="label">状态</div>
    <div class="value"><span class="status-dot off" id="statusDot"></span><span id="statusText">未连接</span><button id="reconnectBtn" class="reconnect-btn" style="display:none" onclick="reconnect()">重连</button></div>
    <div class="label">工作目录</div>
    <div class="value" id="workspaceDir" style="cursor:pointer" title="点击修改" onclick="editWorkspace()">-</div>
    <div class="label">Session</div>
    <div class="value" id="sessionId">-</div>
  </div>
  <div class="sidebar-footer">
    <span>界面主题</span>
    <div class="theme-switch">
      <button class="theme-btn" data-t="dark" onclick="setTheme('dark')">&#9789;</button>
      <button class="theme-btn" data-t="light" onclick="setTheme('light')">&#9788;</button>
      <button class="theme-btn" data-t="warm" onclick="setTheme('warm')">&#9731;</button>
    </div>
  </div>
</div>
<div id="chatMain"></div>
<div class="doc-view" id="docView">
  <div class="doc-header">
    <button class="doc-back" onclick="closeDocView()">&#8592; 返回</button>
    <span class="doc-title" id="docTitle"></span>
    <div class="doc-actions">
      <button class="doc-btn" id="docPreviewBtn" onclick="toggleHtmlPreview()" style="display:none">预览</button>
      <button class="doc-btn" id="docFullscreenBtn" onclick="toggleSlideViewer()" style="display:none" title="全屏幻灯片 (↑↓翻页)">&#9974; 全屏</button>
      <button class="doc-btn" id="docDownloadBtn" onclick="downloadDoc()" title="下载文件">&#11015; 下载</button>
      <button class="doc-btn" id="docEditBtn" onclick="editDoc()">编辑</button>
      <button class="doc-btn" id="docNewBtn" onclick="showNewDocModal()">新建</button>
      <button class="doc-btn danger" onclick="deleteDoc()">删除</button>
    </div>
  </div>
  <div class="doc-content" id="docContentArea"><div class="doc-content-inner" id="docContentInner"></div></div>
  <div class="doc-edit-area" id="docEditArea" style="display:none">
    <textarea id="docEditText"></textarea>
    <div class="doc-edit-actions">
      <button class="cancel-btn" onclick="cancelEdit()">取消</button>
      <button class="save-btn" onclick="saveDoc()">保存</button>
    </div>
  </div>
</div>
<div class="slide-viewer" id="slideViewer">
  <div class="slide-viewer-header">
    <span class="slide-viewer-title" id="slideViewerTitle"></span>
    <span class="slide-viewer-counter" id="slideViewerCounter"></span>
    <button class="slide-viewer-close" id="slideViewerCloseBtn" onclick="closeSlideViewer()">&times;</button>
  </div>
  <div class="slide-viewer-body" id="slideViewerBody">
    <button class="slide-nav-btn slide-nav-prev" onclick="prevSlide()" title="上一页 (↑)">&#8249;</button>
    <div class="slide-img-container" id="slideImgContainer">
      <img class="slide-img" id="slideImg" alt="" onclick="nextSlide()" title="点击下一页">
    </div>
    <button class="slide-nav-btn slide-nav-next" onclick="nextSlide()" title="下一页 (↓)">&#8250;</button>
  </div>
  <div class="slide-viewer-loading" id="slideViewerLoading" style="display:none">
    <span>&#9203; 正在准备幻灯片，请稍候...</span>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">新建文档</div>
    <input type="text" class="modal-input" id="modalInput" placeholder="输入文件名（如 05-新文档.md）">
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">取消</button>
      <button class="confirm-btn" id="modalConfirmBtn" onclick="modalConfirm()">确认</button>
    </div>
  </div>
</div>
<!-- Global file input (shared across sessions) -->
<input type="file" id="fileInput" multiple style="display:none" onchange="handleFileSelect(event)">
<script src="/static/js/app.js?v=1789616029"></script>
<script src="/static/js/theme.js?v=1789616029"></script>
<script src="/static/js/chat.js?v=1789616029"></script>
<script src="/static/js/trace.js?v=1789616029"></script>
<script src="/static/js/upload.js?v=1789616029"></script>
<script src="/static/js/mode.js?v=1789616029"></script>
<script src="/static/js/project.js?v=1789616029"></script>
</body>
</html>
