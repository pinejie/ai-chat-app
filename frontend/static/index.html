<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZD Code</title>
<link rel="stylesheet" href="/static/highlight-theme-dark.css" id="hljs-dark">
<link rel="stylesheet" href="/static/highlight-theme-light.css" id="hljs-light" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="/static/js/highlight.min.js"></script>
<script src="/static/js/purify.min.js?v=1792643367"></script>
<link rel="stylesheet" href="/static/style.css?v=1792807083">
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" id="tabChat" onclick="switchSidebarTab('chat')">对话</button>
      <button class="sidebar-tab" id="tabProjects" onclick="switchSidebarTab('projects')">项目文档</button>
    </div>
    <button id="newChatBtn" onclick="newChat()">+ 新对话</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="project-toolbar" style="display:none">
    <button class="proj-btn" onclick="projectNewDoc()">+ 新建文档</button>
    <button class="proj-btn" onclick="projectNewFolder()">+ 新建文件夹</button>
    <button class="proj-btn danger" onclick="projectDelete()">删除文件夹</button>
  </div>
  <div class="project-list" id="projectList"></div>
  <div class="sidebar-info">
    <div class="label">状态</div>
    <div class="value"><span class="status-dot off" id="statusDot"></span><span id="statusText">未连接</span><button id="reconnectBtn" class="reconnect-btn" onclick="reconnect()">重连</button></div>
    <div class="label">对话工作目录</div>
    <div class="value" id="workspaceDir" title="">-</div>
    <div class="ws-actions">
      <button class="ws-act-btn" onclick="forkChat()">换目录</button>
      <button class="ws-act-btn" onclick="wsMgrOpen()">目录管理</button>
    </div>
    <div class="label">Session</div>
    <div class="value" id="sessionId">-</div>
  </div>
  <div class="sidebar-footer">
    <span>界面主题</span>
    <div class="theme-switch">
      <button class="theme-btn" data-t="dark" onclick="setTheme('dark')">&#9789;</button>
      <button class="theme-btn" data-t="light" onclick="setTheme('light')">&#9788;</button>
      <button class="theme-btn" data-t="warm" onclick="setTheme('warm')">&#9731;</button>
    </div>
  </div>
</div>
<div id="chatMain"></div>
<div class="doc-view" id="docView">
  <div class="doc-header">
    <button class="doc-back" onclick="closeDocView()">&#8592; 返回</button>
    <span class="doc-title" id="docTitle"></span>
    <div class="doc-actions">
      <button class="doc-btn" id="docPreviewBtn" onclick="toggleHtmlPreview()" style="display:none">预览</button>
      <button class="doc-btn" id="docFullscreenBtn" onclick="toggleSlideViewer()" style="display:none" title="全屏幻灯片 (↑↓翻页)">&#9974; 全屏</button>
      <button class="doc-btn" id="docDownloadBtn" onclick="downloadDoc()" title="下载文件">&#11015; 下载</button>
      <button class="doc-btn" id="docEditBtn" onclick="editDoc()">编辑</button>
      <button class="doc-btn danger" onclick="deleteDoc()">删除</button>
    </div>
  </div>
  <div class="doc-content" id="docContentArea"><div class="doc-content-inner" id="docContentInner"></div></div>
  <div class="doc-edit-area" id="docEditArea" style="display:none">
    <textarea id="docEditText"></textarea>
    <div class="doc-edit-actions">
      <button class="cancel-btn" onclick="cancelEdit()">取消</button>
      <button class="save-btn" onclick="saveDoc()">保存</button>
    </div>
  </div>
</div>
<div class="slide-viewer" id="slideViewer">
  <div class="slide-viewer-header">
    <span class="slide-viewer-title" id="slideViewerTitle"></span>
    <span class="slide-viewer-counter" id="slideViewerCounter"></span>
    <button class="slide-viewer-close" id="slideViewerCloseBtn" onclick="closeSlideViewer()">&times;</button>
  </div>
  <div class="slide-viewer-body" id="slideViewerBody">
    <button class="slide-nav-btn slide-nav-prev" onclick="prevSlide()" title="上一页 (↑)">&#8249;</button>
    <div class="slide-img-container" id="slideImgContainer">
      <img class="slide-img" id="slideImg" alt="" onclick="nextSlide()" title="点击下一页">
    </div>
    <button class="slide-nav-btn slide-nav-next" onclick="nextSlide()" title="下一页 (↓)">&#8250;</button>
  </div>
  <div class="slide-viewer-loading" id="slideViewerLoading" style="display:none">
    <span>&#9203; 正在准备幻灯片，请稍候...</span>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">新建文档</div>
    <input type="text" class="modal-input" id="modalInput" placeholder="输入文件名（如 05-新文档.md）">
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">取消</button>
      <button class="confirm-btn" id="modalConfirmBtn" onclick="modalConfirm()">确认</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="confirmOverlay">
  <div class="modal-box">
    <div class="modal-title" id="confirmTitle">确认删除</div>
    <div class="modal-message" id="confirmMessage"></div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeConfirm()">取消</button>
      <button class="confirm-btn danger" id="confirmBtn" onclick="confirmAction()">确认</button>
    </div>
  </div>
</div>
<!-- 工作目录：选择弹层（新建/fork 复用） -->
<div class="modal-overlay" id="wsPickModal">
  <div class="modal-box">
    <div class="modal-title" id="wsPickTitle">选择工作目录</div>
    <div class="modal-warn" id="wsPickWarn">换目录相当于在新目录创建一个新对话：AI 上下文重新开始，旧对话原样保留在列表里。</div>
    <div class="ws-pick-list" id="wsPickList"></div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="wsPickClose()">取消</button>
      <button class="confirm-btn" onclick="wsPickConfirm()">确定</button>
    </div>
  </div>
</div>
<!-- 工作目录：注册表管理弹层 -->
<div class="modal-overlay" id="wsMgrModal">
  <div class="modal-box ws-mgr-box">
    <div class="modal-title">工作目录管理</div>
    <div class="ws-mgr-list" id="wsMgrList"></div>
    <div class="ws-mgr-form">
      <input type="text" class="modal-input" id="wsMgrName" placeholder="名称（如：主工作区）">
      <input type="text" class="modal-input" id="wsMgrPath" placeholder="绝对路径（/home/... 或 ~/...，目录必须已存在）">
      <label class="ws-mgr-default"><input type="checkbox" id="wsMgrDefault">设为默认（新建对话预选此目录）</label>
      <div class="ws-mgr-error" id="wsMgrError"></div>
      <div class="modal-actions">
        <button class="cancel-btn" id="wsMgrCancel" style="display:none" onclick="wsMgrCancelEdit()">取消编辑</button>
        <button class="cancel-btn" onclick="wsMgrClose()">关闭</button>
        <button class="confirm-btn" id="wsMgrSave" onclick="wsMgrSave()">新增</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-overlay" id="loginOverlay">
  <div class="modal-box login-box">
    <div class="login-brand">ZD Code</div>
    <div class="login-hint">请输入访问口令</div>
    <input type="password" class="modal-input" id="loginInput" placeholder="访问口令" autocomplete="current-password">
    <div class="login-error" id="loginError"></div>
    <div class="modal-actions"><button class="confirm-btn" id="loginBtn">进入</button></div>
  </div>
</div>
<!-- Global file input (shared across sessions) -->
<input type="file" id="fileInput" multiple style="display:none" onchange="handleFileSelect(event)">
<script src="/static/js/app.js?v=1792736080"></script>
<script src="/static/js/theme.js?v=1792643367"></script>
<script src="/static/js/chat.js?v=1792807083"></script>
<script src="/static/js/trace.js?v=1792643367"></script>
<script src="/static/js/upload.js?v=1792643367"></script>
<script src="/static/js/mode.js?v=1792643367"></script>
<script src="/static/js/project.js?v=1792736080"></script>
</body>
</html>
